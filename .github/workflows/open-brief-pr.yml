name: Open review PR for new brief

# When the daily Claude task pushes a branch named brief/YYYY-MM-DD,
# this opens a pull request so you can review and merge it from your phone.
on:
  push:
    branches: ["brief/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Open (or update) the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          DATE="${BRANCH#brief/}"
          # PR description = the commit message body written by the daily task
          git log -1 --format=%b > pr_body.md
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $BRANCH; new commit added to it."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "📰 Daily brief: $DATE" \
              --body-file pr_body.md
          fi
